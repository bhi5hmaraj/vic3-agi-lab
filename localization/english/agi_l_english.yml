l_english:

 # Game rules
 rule_agi_scenario:0 "AI Scenario"
 setting_agi_scenario_none:0 "None (control run)"
 setting_agi_scenario_none_desc:0 "No AI shock. Use this as the control to compare a scenario run against."
 setting_agi_scenario_ai2027_race:0 "AI 2027: Race"
 setting_agi_scenario_ai2027_race_desc:0 "The race ending of AI 2027 (AI Futures Project). The US leads and China follows about two months behind. AI reaches the economy in 2027, robots in 2028, and a basic income in 2029. The run stops in January 2030, before the scenario's catastrophe."
 setting_agi_scenario_ai2027_slowdown:0 "AI 2027: Slowdown"
 setting_agi_scenario_ai2027_slowdown_desc:0 "The slowdown ending of AI 2027. Same as the race until October 2027. Then AI research slows under oversight, but superhuman AI still reaches the public in May 2028, followed by a US-China deal and a worldwide transformation."
 setting_agi_scenario_ai2040_plan_a:0 "AI 2040: Plan A"
 setting_agi_scenario_ai2040_plan_a_desc:0 "AI 2040: Plan A (AI Futures Project). A 2029 US-China deal pauses training and verifies compute. From 2032 robot and compute growth is capped and a citizen's dividend is paid. AI is held at top-expert level from 2035. China runs about two years behind the US and the rest of the world about three."
 rule_agi_shock_start:0 "AI Shock Start"
 setting_agi_shock_start_1955:0 "1955"
 setting_agi_shock_start_1955_desc:0 "Month 0 of the scenario (January 2026 in the source) is mapped to 1955. Fastest to reach. The economy is still mostly farms and factories, so the early, office-only AI levels move less."
 setting_agi_shock_start_1970:0 "1970"
 setting_agi_shock_start_1970_desc:0 "Month 0 of the scenario is mapped to 1970."
 setting_agi_shock_start_1985:0 "1985"
 setting_agi_shock_start_1985_desc:0 "Month 0 of the scenario is mapped to 1985. The economy has the largest service sector of the three starts, so it is the closest to today's."

 # Modifiers
 agi_tier_1:0 "AI Level 1: AI Assistants"
 agi_tier_1_desc:0 "AI agents handle routine office tasks. Offices need slightly fewer people."
 agi_tier_2:0 "AI Level 2: AI Remote Workers"
 agi_tier_2_desc:0 "AI does much routine knowledge work cheaply. Factories start to automate."
 agi_tier_3:0 "AI Level 3: AI-Majority Knowledge Work"
 agi_tier_3_desc:0 "AI does more knowledge work than all our people combined."
 agi_tier_4:0 "AI Level 4: AI and Robots"
 agi_tier_4_desc:0 "AI does most knowledge work. Robots spread through factories, farms and mines."
 agi_tier_5:0 "AI Level 5: AI-Run Economy"
 agi_tier_5_desc:0 "AI systems and robots do most of the work in the economy."
 agi_dividend_1:0 "AI Dividend"
 agi_dividend_1_desc:0 "Payments funded by AI revenue give people an income whether or not they work."
 agi_dividend_2:0 "Large AI Dividend"
 agi_dividend_2_desc:0 "AI-funded payments are now a large share of household income."

 # Events
 agi.ok:0 "Noted"
 agi.1.t:0 "AI Assistants Arrive"
 agi.1.d:0 "Our offices now use AI agents for routine work and need slightly fewer people. Watch the Employment panel: service jobs change first. Compare against a control run with no AI scenario."
 agi.2.t:0 "AI Remote Workers"
 agi.2.d:0 "AI now does much of the routine knowledge work people used to do, and factories are starting to automate. Watch service and factory jobs in the Employment panel, and the Radicals count in the Politics panel."
 agi.3.t:0 "AI Does Most Knowledge Work"
 agi.3.d:0 "AI now does more knowledge work than all our people combined. Output rises faster than jobs. Watch GDP against employment: if GDP climbs while employment falls, the gains are going to building owners."
 agi.4.t:0 "AI and Robots"
 agi.4.d:0 "AI does most knowledge work, and robots are spreading through factories, farms and mines. Watch Standard of Living and which Interest Groups gain or lose power."
 agi.5.t:0 "An AI-Run Economy"
 agi.5.d:0 "AI systems and robots now do most of the work in our economy. Compare our GDP, employment and radicalism with countries that got here later, or not at all."
 agi.11.t:0 "Scenario Window Over"
 agi.11.d:0 "The scenario's modelled period has ended. The simulation keeps running, but no further AI steps will happen. Save now to compare this run with your control."
 agi.21.t:0 "Scenario: AI 2027, Race"
 agi.21.d:0 "The AI shock begins. This clock month is January 2026 in the AI 2027 race ending. The US leads, China follows, and the rest of the world gets AI later. Watch employment, living standards, radicalism and GDP."
 agi.22.t:0 "Scenario: AI 2027, Slowdown"
 agi.22.d:0 "The AI shock begins. This clock month is January 2026 in the AI 2027 slowdown ending. It follows the race until October 2027. Then AI research slows under oversight, but the economy changes as fast as in the race, and the change spreads to the whole world."
 agi.23.t:0 "Scenario: AI 2040, Plan A"
 agi.23.d:0 "The AI shock begins. This clock month is January 2026 in AI 2040: Plan A. In 2029 a US-China deal pauses AI training. From 2032, caps on robots and compute keep growth gradual and a citizen's dividend is paid."
