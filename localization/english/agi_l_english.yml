l_english:

 # Game rules
 rule_agi_scenario:0 "AI Scenario"
 setting_agi_scenario_none:0 "None (control run)"
 setting_agi_scenario_none_desc:0 "No AI shock. Use this as the control to compare a scenario run against."
 setting_agi_scenario_ai2027_race:0 "AI 2027: Race"
 setting_agi_scenario_ai2027_race_desc:0 "The race ending of AI 2027 (AI Futures Project). The US leads, China follows about two months behind, and superintelligence reaches the economy by mid-2028. The run stops before the scenario's catastrophe."
 setting_agi_scenario_ai2027_slowdown:0 "AI 2027: Slowdown"
 setting_agi_scenario_ai2027_slowdown_desc:0 "The slowdown ending of AI 2027. Same as the race until October 2027, then oversight, a US-China deal, and a managed transformation."
 setting_agi_scenario_ai2040_plan_a:0 "AI 2040: Plan A"
 setting_agi_scenario_ai2040_plan_a_desc:0 "AI 2040: Plan A (AI Futures Project). A 2029 US-China deal caps compute and robots, pauses at top-expert AI from 2035, pays a citizen's dividend, and reaches superintelligence in 2040."
 rule_agi_shock_start:0 "AI Shock Start"
 setting_agi_shock_start_1955:0 "1955"
 setting_agi_shock_start_1955_desc:0 "Month 0 of the scenario (January 2026 in the source) is mapped to 1955. Fastest to run."
 setting_agi_shock_start_1970:0 "1970"
 setting_agi_shock_start_1970_desc:0 "Month 0 of the scenario is mapped to 1970."
 setting_agi_shock_start_1985:0 "1985"
 setting_agi_shock_start_1985_desc:0 "Month 0 of the scenario is mapped to 1985. Use this if automation does not take hold at earlier starts because nothing yet makes computers and robots."

 # Modifiers
 agi_tier_1:0 "AI Level 1: Agents"
 agi_tier_1_desc:0 "Unreliable AI agents take on routine office tasks."
 agi_tier_2:0 "AI Level 2: Cheap Remote Workers"
 agi_tier_2_desc:0 "AI can do much remote knowledge work cheaply."
 agi_tier_3:0 "AI Level 3: Superhuman Coders"
 agi_tier_3_desc:0 "AI outperforms the best human engineers and researchers."
 agi_tier_4:0 "AI Level 4: Top-Expert AI"
 agi_tier_4_desc:0 "AI and robots do most skilled and physical work."
 agi_tier_5:0 "AI Level 5: Superintelligence Economy"
 agi_tier_5_desc:0 "Superintelligent systems run most of the economy."
 agi_dividend_1:0 "Citizen's Dividend"
 agi_dividend_1_desc:0 "Payments funded by compute and robot permits raise living standards."
 agi_dividend_2:0 "Large Citizen's Dividend"
 agi_dividend_2_desc:0 "The permit-funded dividend now pays a large share of household income."

 # Events
 agi.ok:0 "Noted"
 agi.1.t:0 "AI Agents Arrive"
 agi.1.d:0 "Our economy now uses AI agents for routine office work. Watch the Employment panel: clerks are the first jobs to change. Compare against a control run with no AI scenario."
 agi.2.t:0 "Cheap AI Remote Workers"
 agi.2.d:0 "AI can now do much of the remote knowledge work people used to do. Service automation spreads. Watch clerks, engineers and shopkeepers in the Employment panel, and the Radicals count in the Politics panel."
 agi.3.t:0 "Superhuman AI Engineers"
 agi.3.d:0 "AI now outperforms our best engineers. Output rises faster than jobs. Watch GDP against employment: if GDP climbs while employment falls, the gains are going to capital owners."
 agi.4.t:0 "Top-Expert AI and Robots"
 agi.4.d:0 "AI and robots now do most skilled and physical work, including farming and mining. Watch Standard of Living and which Interest Groups gain or lose power."
 agi.5.t:0 "A Superintelligence Economy"
 agi.5.d:0 "Superintelligent systems now run most of the economy. Compare our GDP, employment and radicalism with countries that got here later, or not at all."
 agi.11.t:0 "Scenario Window Over"
 agi.11.d:0 "The scenario's modelled period has ended. The simulation keeps running, but no further AI steps will happen. Save now to compare this run with your control."
 agi.21.t:0 "Scenario: AI 2027, Race"
 agi.21.d:0 "The AI shock begins. This clock month is January 2026 in the AI 2027 race ending. The US leads, China follows, and the rest of the world gets AI later. Watch employment, living standards, radicalism and GDP."
 agi.22.t:0 "Scenario: AI 2027, Slowdown"
 agi.22.d:0 "The AI shock begins. This clock month is January 2026 in the AI 2027 slowdown ending. It follows the race until October 2027, then a slower, overseen path and a US-China deal."
 agi.23.t:0 "Scenario: AI 2040, Plan A"
 agi.23.d:0 "The AI shock begins. This clock month is January 2026 in AI 2040: Plan A. From 2029 a US-China deal caps compute and robots, so AI arrives gradually, with a citizen's dividend from 2032."
